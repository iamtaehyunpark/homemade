[package]
name = "homemade"
version = "0.1.0"
description = "Homemade: the operating layer for personal, AI-generated software"
authors = ["t"]
edition = "2024"

[lib]
name = "homemade_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "macos-private-api"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-drag = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
nix = { version = "0.29", features = ["process", "signal", "term"] }
portable-pty = "0.8"
sysinfo = "0.32"
notify = "7"
dashmap = "6"
uuid = { version = "1", features = ["v4", "serde"] }
walkdir = "2"
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
percent-encoding = "2"
async-trait = "0.1"
keyring = { version = "3", features = ["apple-native", "linux-native"] }
sha2 = "0.10"
hex = "0.4"
anyhow = "1"
thiserror = "1"
glob = "0.3"
mime_guess = "2"
chrono = "0.4"
shell-words = "1"
dirs = "5"
http = "1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
nvml-wrapper = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
